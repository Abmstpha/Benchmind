name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benchmind_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
    
    - name: Set up test environment
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benchmind_test
        JWT_SECRET: test-secret-key-for-ci
        MISTRAL_API_KEY: test-key
        GEMINI_API_KEY: test-key
        GOOGLE_API_KEY: test-key
        ENVIRONMENT: testing
      run: |
        # Run database migrations
        alembic upgrade head
        
        # Initialize test database
        python init_db.py
    
    - name: Run tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benchmind_test
        JWT_SECRET: test-secret-key-for-ci
        MISTRAL_API_KEY: test-key
        GEMINI_API_KEY: test-key
        GOOGLE_API_KEY: test-key
        ENVIRONMENT: testing
      run: |
        # Run basic health check tests
        python -m pytest tests/ -v || echo "No tests found, running basic checks"
        
        # Test app startup
        python -c "from app.main import app; print('✅ App imports successfully')"
        
        # Test database connection
        python -c "
        from app.db.database import engine
        from sqlalchemy import text
        with engine.connect() as conn:
            result = conn.execute(text('SELECT 1'))
            print('✅ Database connection successful')
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run linting
      working-directory: ./backend
      run: |
        # Check code formatting
        black --check --diff . || echo "⚠️ Code formatting issues found"
        
        # Check import sorting
        isort --check-only --diff . || echo "⚠️ Import sorting issues found"
        
        # Run flake8 linting
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting issues found"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check for security vulnerabilities
      working-directory: ./backend
      run: |
        # Check for known security vulnerabilities
        safety check --json || echo "⚠️ Security vulnerabilities found"
        
        # Run bandit security linter
        bandit -r app/ -f json || echo "⚠️ Security issues found"

  deploy:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Render
      run: |
        echo "🚀 Deployment triggered for Render"
        echo "Render will automatically deploy from the main branch"
        echo "Check your Render dashboard for deployment status"
