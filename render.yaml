services:
  - type: web
    name: benchmind-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: benchmind-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: benchmind-db
    databaseName: benchmind
    user: benchmind_user
